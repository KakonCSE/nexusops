[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexusops"
version = "0.1.0"
description = "Intelligent Infrastructure Reliability & MLOps Platform (learning capstone)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pyarrow>=15",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jupyterlab>=4", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
